<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- ?v=2 : iOS met l'icone en cache par URL ; la version force le
         telechargement de la nouvelle icone (fond blanc, logo 85 %). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png?v=2" />
    <link rel="mask-icon" href="/favicon.svg" color="#d14715" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="%VITE_PROJECT_NAME% — Boutique en ligne. Commandez vos produits et suivez vos commandes, où que vous soyez."
    />
    <meta name="theme-color" content="#d14715" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_PROJECT_NAME%" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Partage social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%VITE_PROJECT_NAME%" />
    <meta property="og:title" content="%VITE_PROJECT_NAME% — Boutique en ligne" />
    <meta
      property="og:description"
      content="Commandez vos produits et suivez vos commandes, où que vous soyez."
    />
    <meta property="og:image" content="/icons/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=optional"
    />

    <title>%VITE_PROJECT_NAME% — Boutique en ligne</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
