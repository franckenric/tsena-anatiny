<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- ?v=2 : iOS met l'icone en cache par URL ; la version force le
         telechargement de la nouvelle icone (fond blanc, logo 85 %). -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#e85a28" />
    <meta
      name="description"
      content="%VITE_PROJECT_NAME% — Back Office. Gestion des produits, du stock, des commandes et des livraisons."
    />

    <!-- PWA / iOS : le manifest et le service worker sont injectes par
         vite-plugin-pwa (voir vite.config.ts). Sans eux, le back-office
         n'etait pas installable. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%VITE_PROJECT_NAME% BO" />
    <title>%VITE_PROJECT_NAME% — Back Office</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
