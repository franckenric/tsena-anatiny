# ── Tsena Anatiny — Nginx (production) ────────────────────────────────────────
# Sert les BUILDS STATIQUES des fronts (plus de serveur dev Vite en prod) :
#   gabbieboutique.com         → /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-front-office/dist  (build front-office)
#   admin.gabbieboutique.com   → /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-back-office/dist   (build back-office)
#   apis.gabbieboutique.com    → API FastAPI (localhost:2003)
#
# Les 3 domaines proxifient /api/ et /ws vers l'API et servent /files/ depuis
# le disque (vignettes + originaux) au lieu de passer par uvicorn.
#
# Deploiement :
#   sudo cp nginx-gabbieboutique.conf /etc/nginx/sites-available/gabbieboutique.conf
#   sudo ln -s /etc/nginx/sites-available/gabbieboutique.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Construction des builds (voir deploy/build.sh) :
#   - front-office  → deploy dans /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-front-office/dist
#   - back-office   → deploy dans /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-back-office/dist
#   Les variables de build sont lues depuis le .env UNIQUE a la racine du depot
#   (VITE_API_BASE_URL=/api/v1 → appels API et images en meme origine).
#
# Certificats SSL (un par domaine) dans /opt/projects/project-ready/certs/ :
#   gabbieboutique.com.pem / gabbieboutique.com.key
#   admin.gabbieboutique.com.pem / admin.gabbieboutique.com.key
#   apis.gabbieboutique.com.pem / apis.gabbieboutique.com.key
#
# Images produit : servies directement depuis le dossier files/ du projet API
# (source du bind mount `./tsena-anaty-apis/files:/app/files`) :
#   /opt/projects/project-ready/tsena-anatiny/tsena-anaty-apis/files
# L'utilisateur nginx doit avoir les droits de lecture sur ce dossier.

# ── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gabbieboutique.com www.gabbieboutique.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.gabbieboutique.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name apis.gabbieboutique.com;
    return 301 https://$host$request_uri;
}

# ── Front-office — gabbieboutique.com (build statique) ────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gabbieboutique.com www.gabbieboutique.com;

    ssl_certificate     /opt/projects/project-ready/certs/gabbieboutique.com.pem;
    ssl_certificate_key /opt/projects/project-ready/certs/gabbieboutique.com.key;

    client_max_body_size 100M;

    # Compression (HTML, JS, CSS, JSON, SVG). Les images sont deja compressees.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;

    root /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-front-office/dist;
    index index.html;

    # Assets hashes par Vite : contenus jamais reutilises → cache 1 an.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html : jamais mis en cache, sinon les MAJ du site sont figees.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Service worker PWA : doit toujours etre revalide.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Appels API (VITE_API_BASE_URL=/api/v1 → meme origine).
    location /api/ {
        proxy_pass http://127.0.0.1:2003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_connect_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket (notifications).
    location /ws {
        proxy_pass http://127.0.0.1:2003/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_cache off;
    }

    # Images produit : servies en direct (cache immutable, nom = UUID).
    location ^~ /files/ {
        alias /opt/projects/project-ready/tsena-anatiny/tsena-anaty-apis/files/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # SPA : toute route inconnue renvoie index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

