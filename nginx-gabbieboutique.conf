# ── Gabbie Boutique — Nginx via main-proxy (container) ────────────────────────
# main-proxy lit ce fichier depuis /opt/projects/proxy/conf.d/
# API attendue sur web_network: http://tsena-project-api-1:8081
# Certificats: /opt/projects/project-ready/certs/{*.pem,*.key}

# ── HTTP → HTTPS ──────────────────────────────────────────────────────────────
server {
    listen 80; listen [::]:80;
    server_name gabbieboutique.com www.gabbieboutique.com;
    return 301 https://$host$request_uri;
}
server {
    listen 80; listen [::]:80;
    server_name admin.gabbieboutique.com;
    return 301 https://$host$request_uri;
}
server {
    listen 80; listen [::]:80;
    server_name apis.gabbieboutique.com;
    return 301 https://$host$request_uri;
}

# ── Front-office ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl; listen [::]:443 ssl;
    server_name gabbieboutique.com www.gabbieboutique.com;
    ssl_certificate     /opt/projects/project-ready/certs/gabbieboutique.com.pem;
    ssl_certificate_key /opt/projects/project-ready/certs/gabbieboutique.com.key;
    client_max_body_size 100M;
    gzip on; gzip_vary on; gzip_proxied any; gzip_comp_level 6; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml application/manifest+json image/svg+xml;
    root /opt/projects/project-ready/tsena-anatiny/tsena-anatiny-front-office/dist;
    index index.html;
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location = /index.html { add_header Cache-Control "no-cache, must-revalidate"; }
    location = /sw.js { add_header Cache-Control "no-cache, must-revalidate"; }
    location /api/ { proxy_pass http://tsena-project-api-1:8081; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 3600s; proxy_connect_timeout 3600s; proxy_send_timeout 3600s; }
    location /ws { proxy_pass http://tsena-project-api-1:8081/ws; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 86400s; proxy_send_timeout 86400s; proxy_buffering off; proxy_cache off; }
    location ^~ /files/ { alias /opt/projects/project-ready/tsena-anatiny/tsena-anaty-apis/files/; try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; access_log off; }
    location / { try_files $uri $uri/ /index.html; }
}

# ── Back-office ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl; listen [::]:443 ssl;
    server_name admin.gabbieboutique.com;
    ssl_certificate     /opt/projects/project-ready/certs/gabbieboutique.com.pem;
